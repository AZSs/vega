[project]
name = "vega"
version = "0.0.0"
description = "Vega —— 把长文本织成知识图谱的通用引擎"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",      # Ollama embedding / LLM 调用
    "numpy>=1.26",      # 向量运算
    "sqlite-vec>=0.1",  # 向量持久化(sqlite-vec)
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff>=0.5",
    "mypy>=1.10",
]
serve = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
watch = [
    "watchfiles>=0.21",
]
lightrag = [
    "lightrag-hku>=1.5.4",
]

[project.entry-points."vega.plugins"]
novel = "vega.plugins.novel:NovelPlugin"

[project.scripts]
vega = "vega.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vega"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
strict = true
packages = ["vega"]

[[tool.mypy.overrides]]
module = "sqlite_vec"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "lightrag.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "networkx"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
